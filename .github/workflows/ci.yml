# conv.cat CI — the single required check on every pull request.
#
# This workflow replaces two earlier standalone ones (licence-boundary.yml and
# conv-core-tests.yml), both of which said in their own headers that they should be folded into
# the real pipeline once it existed. This is that pipeline. The *scripts* they called are the
# contract and are unchanged; only the workflow wrapper around them was disposable.
#
# ─── Job layout ─────────────────────────────────────────────────────────────────────────────
#
#   licence ──────────┐
#   rust ──────────────┼──▶ (independently meaningful; each tells you from its name alone what
#   wasm ──▶ js ───────┘     broke — formatting, a type, the licence boundary, the bundle budget)
#
# `js` depends on `wasm` (not parallel with it, unlike the other three) because `packages/engine`
# has a real `file:` dependency on `crates/conv-wasm/pkg` (see its package.json) — `pnpm install`
# has nothing to link against until that directory exists. `wasm` uploads the artifact it already
# builds for the size-budget check; `js` downloads it before installing. This is the fix the
# `js` job used to carry as a comment on its own build step, back when packages/engine was a
# scaffold that imported nothing and the gap didn't matter yet.
#
# Five jobs rather than one sequential script, for one reason: when CI goes red, a contributor
# should be able to tell from the job name alone whether they broke formatting, a type, the
# licence boundary, or the bundle budget — without opening a log. `build-all.sh` is still the
# local one-command gate (and, matching this dependency, builds Rust/WASM before installing JS
# dependencies — see its own comments); CI deliberately splits it for legibility.
#
# ─── Why every action is pinned to a commit SHA ─────────────────────────────────────────────
#
# A tag is mutable: whoever controls the action repo can repoint v4 at new code, and it runs
# with our token on our repo. This project parses untrusted binary input and ships a WASM
# artifact to every visitor, so a supply-chain compromise here is not theoretical. SHAs are
# immutable; Dependabot (.github/dependabot.yml, github-actions ecosystem) proposes the bumps
# so the pin never turns into rot. The trailing comment is the human-readable version.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push while CI is mid-run should cancel the superseded run rather than pay for both.
# Never cancel on main: those runs are the record of what actually landed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ── Licence boundary ──────────────────────────────────────────────────────────────────────
  # Deliberately toolchain-free (no Node, no Rust, no install) so it stays under ~10 seconds
  # and cannot be masked by a build failure elsewhere in the matrix.
  licence:
    name: Licence boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: No library depends on apps/
        run: ./.github/scripts/check-licence-boundary.sh

  # ── Rust ──────────────────────────────────────────────────────────────────────────────────
  rust:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # rustup reads rust-toolchain.toml itself (channel, components, targets). Running `show`
      # forces that install up front with clear log output instead of implicitly, mid-command.
      - name: Install the pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Keyed so the wasm job's differently-targeted artifacts never collide with these.
          shared-key: rust-workspace

      - name: Formatting
        run: cargo fmt --all --check

      # -D warnings is what makes #![warn(missing_docs)] in conv-core a hard gate: every public
      # item stays documented because CI refuses to merge otherwise.
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Includes conv-core's golden-file conformance suite. A conformance suite nobody enforces
      # is just documentation — this step is what makes community converter PRs reviewable.
      - name: Tests (includes the golden-file conformance suite)
        run: cargo test --workspace

  # ── WebAssembly ───────────────────────────────────────────────────────────────────────────
  # Separate from the Rust job because it answers a different question: not "is the code
  # correct" but "is what we ship to every visitor still small". Runs before `js`, which depends
  # on its artifact — see the job-layout note at the top of this file.
  wasm:
    name: WASM — build and size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: wasm

      # wasm-pack is the one toolchain the repo cannot pin declaratively (no .nvmrc or
      # rust-toolchain.toml equivalent), so .wasm-pack-version is the pin and this installs
      # exactly it. The version matters more than a normal bump: wasm-pack bundles a
      # wasm-bindgen CLI that must match the wasm-bindgen CRATE version in conv-wasm's
      # Cargo.toml, and a mismatch surfaces as a confusing runtime error in the browser rather
      # than a build failure here.
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --locked --version "$(tr -d '[:space:]' < .wasm-pack-version)"

      # --release because the budget is about what ships. A debug .wasm is several times larger
      # and measuring it would make the budget meaningless. This also means `js` typechecks and
      # builds against the same release artifact CI would actually ship, not a separately-built
      # debug one.
      - name: Build the release WASM artifact
        run: wasm-pack build crates/conv-wasm --target web --out-dir pkg --release

      - name: Enforce the size budget
        run: ./.github/scripts/check-wasm-size.sh

      # Handed to the `js` job below, which has nothing for its `file:` dependency on this
      # directory to resolve against otherwise. Short retention: this is an intermediate artifact
      # for this run only, not something anyone downloads after the fact.
      - name: Upload the WASM artifact for the js job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conv-wasm-pkg
          path: crates/conv-wasm/pkg
          retention-days: 1

  # ── JavaScript / TypeScript ───────────────────────────────────────────────────────────────
  js:
    name: JS — lint, typecheck, build
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # packages/engine depends on this directory via a `file:` path (see its package.json) —
      # `pnpm install` below has nothing to link against without it. See the job-layout note at
      # the top of this file for why this job needs `wasm` instead of running in parallel with it.
      - name: Download the WASM artifact from the wasm job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conv-wasm-pkg
          path: crates/conv-wasm/pkg

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        # Version comes from the "packageManager" field in package.json — no second place to
        # bump, no chance of CI and local pnpm drifting apart.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile: a drifting lockfile must fail the build rather than be silently
      # "fixed" in CI, which is how an unreviewed dependency reaches main.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first, not last: apps/web imports @conv.cat/engine and @conv.cat/data by their
      # package.json `types` field (./dist/index.d.ts), not by TS project reference or path
      # mapping to source — so until each workspace package's own `tsc` has run once, those
      # types don't exist on disk yet and both typed ESLint rules and `tsc --noEmit` below can
      # only see them as `any`/unresolved, not "the type is actually wrong". Same reasoning
      # `scripts/build-all.sh` already follows (build JS packages/apps before its own lint/
      # typecheck steps) — this job used to do lint/typecheck first and was red on `main` for
      # exactly this reason before this comment was added.
      - name: Build packages and apps
        run: pnpm build

      # Lint is a gate from the first commit, on purpose — see the long note at the top of
      # eslint.config.js about the debt trap this project is rebuilding to escape.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # ── Dependency review ─────────────────────────────────────────────────────────────────────
  # PR-only: flags a dependency added in this PR that carries a known vulnerability, before it
  # is merged rather than after Dependabot notices on main.
  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # NOTE: `deny-licenses` is deliberately NOT set here, even though a licence gate looks
          # like an obvious fit for a repo with a split licence. This repo *publishes* AGPL-3.0
          # packages (apps/*) into its own dependency graph, so an AGPL denylist risks failing on
          # conv.cat's own apps rather than on a third-party dependency — a confusing red build
          # that teaches people to ignore this job. The one-way apps/-vs-libraries rule that
          # actually protects the split licence is enforced by check-licence-boundary.sh in the
          # `licence` job above, against our own source, where the question is well-defined.
