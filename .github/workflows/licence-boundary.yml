# Enforces the one-way dependency rule behind conv.cat's split licence:
# apps/* (AGPL-3.0-only) may depend on crates/* and packages/* (MIT), never the
# reverse. See docs/ARCHITECTURE.md § Dependency direction.
#
# Deliberately standalone and toolchain-free (no Node, no Rust, no install) so
# it stays fast and cannot be broken by a build failure. The full CI pipeline
# lands separately and may fold this job in — keep the script, it is the
# contract; the workflow around it is disposable.
name: Licence boundary

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    name: No library depends on apps/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check licence boundary
        run: ./.github/scripts/check-licence-boundary.sh
